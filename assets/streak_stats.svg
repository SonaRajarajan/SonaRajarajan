<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" fill="none">
  <rect width="800" height="220" rx="12" fill="#0D1117"/>
  
  <style>
    .stat-number { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 15px; fill: #FFFFFF; }
    .stat-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #00F2FE; }
  </style>

  <!-- Left Column: Total Contributions -->
  <g transform="translate(140, 0)">
    <text x="0" y="85" text-anchor="middle" class="stat-number" font-size="38" fill="#00F2FE">514</text>
    <text x="0" y="125" text-anchor="middle" class="stat-label">Total Contributions</text>
    <text x="0" y="155" text-anchor="middle" class="stat-sub">Nov 11, 2023 - Present</text>
  </g>

  <!-- Center Column: Current Streak (23) -->
  <g transform="translate(400, 0)">
    <!-- Ring Circle -->
    <circle cx="0" cy="72" r="42" stroke="#00F2FE" stroke-width="5" fill="none"/>
    
    <!-- Flame Icon -->
    <g transform="translate(0, 14)">
      <path d="M-8 12 C-9 6, -2 2, 0 -4 C2 2, 9 6, 9 13 C9 19, 5 23, 0 23 C-5 23, -9 19, -8 12 Z" fill="#FF007F"/>
      <path d="M-4 14 C-4 10, 0 8, 0 5 C0 8, 4 9, 4 13 C4 16, 2 18, 0 18 C-2 18, -4 16, -4 14 Z" fill="#FFD700"/>
    </g>

    <!-- Streak Count 23 -->
    <text x="0" y="85" text-anchor="middle" class="stat-number" font-size="38" fill="#FF007F">23</text>
    
    <!-- Label -->
    <text x="0" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#00F2FE">Current Streak</text>
    <text x="0" y="168" text-anchor="middle" class="stat-sub">Jul 11 - Aug 2</text>
  </g>

  <!-- Right Column: Longest Streak (23) -->
  <g transform="translate(660, 0)">
    <text x="0" y="85" text-anchor="middle" class="stat-number" font-size="38" fill="#00F2FE">23</text>
    <text x="0" y="125" text-anchor="middle" class="stat-label">Longest Streak</text>
    <text x="0" y="155" text-anchor="middle" class="stat-sub">Jul 11 - Aug 2</text>
  </g>
</svg>
